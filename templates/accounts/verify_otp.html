{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Verify OTP</h2>
    <p>Please enter the OTP sent to your email</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Verify</button>
    </form>
</div>
{% endblock %}
