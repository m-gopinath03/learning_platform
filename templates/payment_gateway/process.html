{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">Complete Your Purchase</h2>
                    {% if course %}
                    <div class="course-details mb-4">
                        <h4>{{ course.title }}</h4>
                        <p class="text-primary h5">Price: ${{ course.price }}</p>
                    </div>
                    <form method="post" action="{% url 'payment_gateway:payment-process' course.id %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary btn-lg">
                            Proceed to Payment
                        </button>
                    </form>
                    {% else %}
                    <p class="text-danger">Course information not available</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
