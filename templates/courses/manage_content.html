{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Manage Content for {{ course.title }}</h2>
    <div class="list-group" id="content-list">
        {% for content in contents %}
        <div class="list-group-item d-flex justify-content-between align-items-center" data-id="{{ content.id }}">
            <div>
                <h5 class="mb-1">{{ content.title }}</h5>
                <p class="mb-1">{{ content.content|truncatewords:20 }}</p>
            </div>
            <div>
                <a href="{% url 'edit_course_content' content.id %}" class="btn btn-sm btn-primary">Edit</a>
                <button class="btn btn-sm btn-danger" onclick="confirmDelete({{ content.id }})">Delete</button>
            </div>
        </div>
        {% empty %}
        <p>No content available. <a href="{% url 'add_course_content' course.slug %}">Add new content</a>.</p>
        {% endfor %}
    </div>
    <a href="{% url 'add_course_content' course.slug %}" class="btn btn-success mt-3">Add New Content</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const contentList = document.getElementById('content-list');
        if (contentList) {
            new Sortable(contentList, {
                animation: 150,
                onEnd: function() {
                    const newOrder = Array.from(contentList.children).map(item => item.dataset.id);
                    
                    // Send new order to server
                    fetch(window.location.href, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: 'new_order=' + newOrder.join(',')
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            alert('Content order updated successfully');
                        }
                    });
                }
            });
        }
    });

    function confirmDelete(contentId) {
        if (confirm('Are you sure you want to delete this content?')) {
            fetch(`/courses/content/${contentId}/delete/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Content deleted successfully');
                    location.reload();
                } else {
                    alert('Failed to delete content');
                }
            });
        }
    }
</script>
{% endblock %}
