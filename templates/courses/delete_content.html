{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Content</h2>
    <p>Are you sure you want to delete the content "{{ content.title }}" from the course "{{ content.course.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'manage_course_content' content.course.slug %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
